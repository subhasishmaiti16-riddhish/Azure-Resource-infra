pool: pipeline-ADO

trigger:
  - main
  - feature/*

variables:
  terraformWorkingDir: '$(System.DefaultWorkingDirectory)/Azure-Resources-infra/environment'
  azureServiceonnection: 'azure-pipeline-yaml'
  backendResourceGroupName: 'rg-devops'
  backendStorageAccountName: 'datablockstorage'
  backendContainerName: 'aksstoragecont'
  backendKey: 'preprod.aksstoragecont'

stages:

# =========================================================
# 1. Terraform Init + Format + Validation
# =========================================================
- stage: terraformInitFmtAndValidation
  displayName: Terraform Init Fmt And Validation

  jobs:
    - job: terraformInitFmtAndValidation
      displayName: Terraform Init Fmt And Validation

      steps:

      - task: TerraformTask@5
        displayName: Terraform Init
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(terraformWorkingDir)'
          backendServiceArm: '$(azureServiceonnection)'
          backendAzureRmResourceGroupName: '$(backendResourceGroupName)'
          backendAzureRmStorageAccountName: '$(backendStorageAccountName)'
          backendAzureRmContainerName: '$(backendContainerName)'
          backendAzureRmKey: '$(backendKey)'

      - powershell: |
          terraform fmt -check -recursive
        displayName: Terraform Format Check
        workingDirectory: '$(terraformWorkingDir)'

      - task: TerraformTask@5
        displayName: Terraform Validate
        inputs:
          provider: 'azurerm'
          command: 'validate'
          workingDirectory: '$(terraformWorkingDir)'

- stage: terraformScan
  displayName: terraform Scan
  jobs:
  - job: Scan
    displayName: terraform Scan
    steps:
    - task: PowerShell@2
      displayName: tflintScan
      inputs:
        targetType: 'inline'
        script: 'tflint --recursive --force'

    - task: PowerShell@2
      displayName: Trivy Terraform Security Scan
      inputs:
        targetType: 'inline'
        script: |
          trivy config --severity HIGH,CRITICAL --exit-code 1 "$(terraformRootDir)"

# =========================================================
# 2. Terraform Init + Plan
# =========================================================
- stage: terraformInitAndPlan
  displayName: Terraform Init And Plan
  dependsOn: terraformScan

  jobs:
    - job: terraformInitAndPlan
      displayName: Terraform Init And Plan

      steps:

      - task: TerraformTask@5
        displayName: Terraform Init
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(terraformWorkingDir)'
          backendServiceArm: '$(azureServiceonnection)'
          backendAzureRmResourceGroupName: '$(backendResourceGroupName)'
          backendAzureRmStorageAccountName: '$(backendStorageAccountName)'
          backendAzureRmContainerName: '$(backendContainerName)'
          backendAzureRmKey: '$(backendKey)'

      - task: TerraformTask@5
        displayName: Terraform Plan
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: '$(terraformWorkingDir)'
          environmentServiceNameAzureRM: '$(azureServiceonnection)'
      
      - powershell: |
          choco install infracost -y
        displayName: Install Infracost

      - powershell: |
          infracost breakdown `
            --path "$(terraformWorkingDir)" `
            --format table
        displayName: Infracost Cost Estimate


# =========================================================
# 3. Terraform Apply - MAIN ONLY
# =========================================================
- stage: terraformInitAndApply
  displayName: Terraform Init And Apply

  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
  )

  jobs:

    # Manual Approval
    - job: manualApproval
      displayName: Manual Approval
      pool: server

      steps:
      - task: ManualValidation@1
        displayName: Manual Approval
        timeoutInMinutes: 1440
        inputs:
          notifyUsers: 'subhasishmaiti16@gmail.com'
          instructions: |
            Terraform Plan has completed successfully.

            Please review the Terraform Plan.

            Approve this step to continue with Terraform Apply.

          onTimeout: 'reject'


    # Terraform Apply
    - job: terraformApply
      displayName: Terraform Apply
      dependsOn: manualApproval

      steps:

      - task: TerraformTask@5
        displayName: Terraform Init
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(terraformWorkingDir)'
          backendServiceArm: '$(azureServiceonnection)'
          backendAzureRmResourceGroupName: '$(backendResourceGroupName)'
          backendAzureRmStorageAccountName: '$(backendStorageAccountName)'
          backendAzureRmContainerName: '$(backendContainerName)'
          backendAzureRmKey: '$(backendKey)'

      - task: TerraformTask@5
        displayName: Terraform Apply
        inputs:
          provider: 'azurerm'
          command: 'apply'
          workingDirectory: '$(terraformWorkingDir)'
          environmentServiceNameAzureRM: '$(azureServiceonnection)'